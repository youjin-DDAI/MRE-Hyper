# Data
dataset: 'fem_box'
noise_ratio: 0.0
freqs: [50, 60, 70, 80, 90, 100]
coords_shape: [80, 100, 10]
spacing: 0.001



# Model:
pde: 'hetero'
activation: 'ss'
omega: 30
n_layers: 5
n_hidden: 128
kernel_initializer: "Glorot normal"

# Training
optimizer: 'adam'
batch_size: 1024
chunk_size: 5000
max_epoch: 2000
lr: 1e-4
weight_decay: 1e-5
log_dir: './tensorboard/mrepinn_fem_box'
pde_scheduling: True
pde_loss_weight: 1e-16 
pde_init_weight: 1e-18 
pde_warmup_iters: 10000 
pde_step_iters: 5000 
pde_step_factor: 10 
input_scaling: True
w_scaling: True
mu_scaling: True




